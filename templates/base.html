{% load static %}<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}客迹 Keji{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    {% if messages %}
      <div id="messages" class="mx-auto max-w-3xl space-y-2 px-4 pt-4">
        {% for message in messages %}
          <div class="badge-neutral block w-full justify-start rounded-lg px-3 py-2 text-sm"
               role="status">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <main>
      {% block content %}{% endblock %}
    </main>

    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
  </body>
</html>
