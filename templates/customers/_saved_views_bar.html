{% comment %}保存视图栏（规格 §15）：保存当前筛选 + 已存视图下拉（应用 / 删除）。{% endcomment %}
<div x-data="savedViewsBar()" class="relative">
  <button type="button" class="btn-secondary btn-sm" @click="open = !open">保存视图</button>
  <div x-show="open" x-cloak @click.outside="open = false"
       class="absolute right-0 z-20 mt-2 w-72 rounded-lg border border-slate-200 bg-white p-3 shadow-lg">
    <form method="post" action="{% url 'core:saved_view_save' %}" class="space-y-2">
      {% csrf_token %}
      <input type="hidden" name="app_label" value="customers">
      <input type="hidden" name="model_name" value="customer">
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <input type="hidden" name="filters" x-ref="filtersInput">
      <input type="text" name="name" required placeholder="视图名" class="input input-sm w-full">
      <button type="submit" class="btn-primary btn-sm w-full" @click="collectFilters()">保存当前筛选</button>
    </form>
    {% if saved_views %}
      <div class="mt-3 border-t border-slate-100 pt-2">
        <p class="label mb-1">已保存视图</p>
        <div class="max-h-56 space-y-1 overflow-y-auto">
          {% for view in saved_views %}
            <div class="flex items-center justify-between gap-2">
              <a href="{% url 'core:saved_view_apply' pk=view.id %}"
                 class="text-body-sm text-brand-700 hover:underline">{{ view.name }}</a>
              <form method="post" action="{% url 'core:saved_view_delete' pk=view.id %}"
                    onsubmit="return confirm('删除视图「{{ view.name }}」？')">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                <button type="submit" class="text-body-sm text-slate-400 hover:text-red-600">删除</button>
              </form>
            </div>
          {% endfor %}
        </div>
      </div>
    {% endif %}
  </div>
</div>

<script>
  function savedViewsBar() {
    return {
      open: false,
      collectFilters() {
        const params = new URLSearchParams(window.location.search);
        const filters = {};
        params.forEach((value, key) => {
          if (key === "tag") {
            if (!filters.tag) filters.tag = [];
            filters.tag.push(value);
          } else if (value !== "") {
            filters[key] = value;
          }
        });
        this.$refs.filtersInput.value = JSON.stringify(filters);
      },
    };
  }
</script>
