# 生产 nginx 配置：对外 HTTP 入口，反代 Django（gunicorn）。
# TLS 终止在部署层（Tailscale / 上游反代）完成；如直连公网请在反代前自行加 HTTPS。
# 监听 127.0.0.1:8080（compose 绑定），仅本机 / 内网可达。

worker_processes auto;

# 应用以 mkstemp→rename 原子写入，媒体文件权限为 0600（仅属主可读）。
# nginx worker 需与 app 同 UID（1001，见 nginx.Dockerfile）才能读取卷，保持非世界可读。
user app;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 上传文件与长请求：150MB 请求体 + 300s 代理超时（原图批量导入）。
    client_max_body_size 150m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    server {
        listen 80;
        server_name _;

        # 健康检查端点：放行给编排探活（无鉴权）。
        location = /healthz/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
        }

        # 静态文件直接由 nginx 从共享卷提供（web 的 collectstatic 已灌入）。
        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 用户上传媒体文件（原图/派生图）由共享卷提供。
        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
        }

        # 其余请求全部反代到 Django 应用。
        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
