# Development-only PostgreSQL 17 container.
#
# WARNING: dev-only credentials. Never use this configuration in production.
# Production should pin image digests and use a secrets manager.
services:
  db:
    image: postgres:17
    # NOTE: dev image is not digest-pinned for easy updates.
    # Pin a digest (e.g. postgres:17@sha256:...) before any production use.
    container_name: keji-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keji
      POSTGRES_USER: keji
      POSTGRES_PASSWORD: keji
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keji"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 开发 Web 服务：Django runserver，代码经 volume 挂载热重载。
  # 与 Makefile 中 `COMPOSE exec web ...` 系列命令保持一致。
  web:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: keji-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../..:/app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ../../.env
        required: false
    environment:
      # 容器内连 db 服务名；host 本机验证用 127.0.0.1（base settings 默认值）。
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: keji
      DB_USER: keji
      DB_PASSWORD: keji
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
