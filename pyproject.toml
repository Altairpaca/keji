[project]
name = "keji"
version = "0.1.0"
description = "客迹 Keji — 自托管客户工作档案系统"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "staticfiles", "media", "backups", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
plugins = []
files = ["config", "apps"]
# Django 尚未提供 py.typed 标记（后续引入 django-stubs 后应移除）。
ignore_missing_imports = true
# settings 模块采用 `from .base import *` + 显式覆盖的惯用写法，关闭 redef 误报。
disable_error_code = ["no-redef"]
# strict-ish：未启用 --strict 全量（尚无 django-stubs），
# 先锁定常见严格项，随代码增长逐步收紧。
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
